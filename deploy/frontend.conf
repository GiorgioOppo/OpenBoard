# Public static frontend. Nginx Proxy Manager routes /api directly to the C API.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        charset utf-8;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }
        location = / {
            try_files /index.html =404;
        }
        location = /index.html {
            try_files $uri =404;
        }
        location ~ ^/(app\.js|planning\.js|productivity\.js|styles\.css|favicon\.svg)$ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        # No API proxy, SPA fallback, directory listing, or arbitrary files.
        location / {
            return 404;
        }
    }
}
