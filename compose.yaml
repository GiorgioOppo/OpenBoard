name: openboard
services:
  app:
    build: .
    image: openboard:0.6.1
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=${OPENBOARD_CACHE_TMPFS_SIZE:-256m},uid=10001,gid=10001,mode=0700"
    expose: ["8080"]
    environment:
      OPENBOARD_BIND: "0.0.0.0"
      OPENBOARD_PORT: "8080"
      OPENBOARD_DB: /tmp/openboard/cache.db
      OPENBOARD_AUTH: "true"
      OPENBOARD_NO_DEMO: "true"
      OPENBOARD_WORKERS: "8"
      OPENBOARD_ATTACHMENT_LIMIT_BYTES: ${OPENBOARD_ATTACHMENT_LIMIT_BYTES:-0}
      OPENBOARD_ATTACHMENT_LIMIT_FILES: ${OPENBOARD_ATTACHMENT_LIMIT_FILES:-0}
      OPENBOARD_CACHE_MAX_BYTES: ${OPENBOARD_CACHE_MAX_BYTES:-0}
      OPENBOARD_CACHE_MIN_FREE_BYTES: ${OPENBOARD_CACHE_MIN_FREE_BYTES:-0}
      OPENBOARD_PUBLIC_URL: ${OPENBOARD_PUBLIC_URL:-http://openboard.localhost}
      OPENBOARD_TRUSTED_PROXY: ${OPENBOARD_PROXY_IP:-172.30.240.2}
      OPENBOARD_POSTGRES_URL: postgresql://openboard:${POSTGRES_APP_PASSWORD:?Run python3 scripts/init-env.py}@postgres:5432/openboard?connect_timeout=10
      OPENBOARD_MONGODB_URI: mongodb://openboard:${MONGO_APP_PASSWORD:?Run python3 scripts/init-env.py}@mongo:27017/openboard?authSource=openboard&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000
      TZ: ${TZ:-Europe/Rome}
    networks: [frontend, backend]
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: openboard-frontend:0.6.1
    restart: unless-stopped
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    expose: ["8080"]
    networks: [frontend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: openboard-postgres:0.6.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: openboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-env.py}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Run python3 scripts/init-env.py}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-openboard.sh:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d openboard && PGPASSWORD=\"$$POSTGRES_APP_PASSWORD\" psql -h 127.0.0.1 -U openboard -d openboard -Atqc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    shm_size: 128m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  mongo:
    build:
      context: .
      dockerfile: Dockerfile.mongo
    image: openboard-mongo:0.6.1
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run python3 scripts/init-env.py}
      MONGO_INITDB_DATABASE: openboard
      OPENBOARD_MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Run python3 scripts/init-env.py}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/10-openboard.js:ro
    networks: [backend]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "const app = db.getSiblingDB('openboard'); if (!app.auth('openboard', process.env.OPENBOARD_MONGO_APP_PASSWORD)) quit(1); quit(app.runCommand({ping: 1}).ok ? 0 : 1);"
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  npm:
    build:
      context: .
      dockerfile: Dockerfile.npm
    image: openboard-proxy:0.6.1
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", "http://127.0.0.1:81/api/"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 12
    ports:
      - "${OPENBOARD_PUBLISH_IP:-127.0.0.1}:${OPENBOARD_HTTP_PORT:-80}:80"
      - "${OPENBOARD_PUBLISH_IP:-127.0.0.1}:${OPENBOARD_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${OPENBOARD_NPM_ADMIN_PORT:-81}:81"
    environment:
      TZ: ${TZ:-Europe/Rome}
      DB_SQLITE_FILE: /data/database.sqlite
      IP_RANGES_FETCH_ENABLED: "false"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      frontend:
        ipv4_address: ${OPENBOARD_PROXY_IP:-172.30.240.2}
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  frontend:
    ipam:
      config:
        - subnet: ${OPENBOARD_FRONTEND_SUBNET:-172.30.240.0/24}
          ip_range: ${OPENBOARD_FRONTEND_IP_RANGE:-172.30.240.128/25}
  backend:
    internal: true
volumes:
  postgres-data:
  mongo-data:
  mongo-config:
  npm-data:
  npm-letsencrypt:
