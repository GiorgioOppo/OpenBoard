name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install SQLite headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev pkg-config
      - name: Install OpenSSL build metadata (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 pkg-config
      - name: Build environment
        run: |
          python3 --version
          node --version
          cc --version
          pkg-config --modversion openssl
      - name: Build
        run: make
      - name: Integration tests
        run: make test
      - name: Frontend data formats
        if: ${{ !cancelled() }}
        run: make test-frontend
      - name: Address and undefined behavior sanitizers
        if: ${{ !cancelled() }}
        run: make test-sanitize
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: openboard-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Generate private Compose configuration
        run: python3 scripts/init-env.py --http-port 8088 --https-port 8443 --admin-port 8181
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build backend and frontend images
        run: docker compose build app frontend
      - name: Start all five services
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Bootstrap private administrators and local proxy
        run: python3 scripts/bootstrap-local.py
      - name: Verify public frontend and authenticated API routing
        shell: bash
        run: |
          set -euo pipefail
          authority='openboard.localhost:8088'
          url='http://127.0.0.1:8088'
          curl --fail --silent --show-error --max-time 20 --header "Host: $authority" --output /dev/null "$url/"
          curl --fail --silent --show-error --max-time 20 --header "Host: $authority" --output /dev/null "$url/api/ready"
          test "$(curl --silent --show-error --max-time 20 --header "Host: $authority" --output /dev/null --write-out '%{http_code}' "$url/api/boards")" = 401
          curl --fail --silent --show-error --max-time 20 --header "Host: $authority" "$url/api/version" |
            python3 -c 'import json,sys; version=json.load(sys.stdin); assert version["auth_enabled"] is True; assert version["storage"] == "postgresql+mongodb"'
      - name: Verify isolated static frontend container
        env:
          OPENBOARD_FRONTEND_IMAGE: openboard-frontend:0.5.0
        run: python3 -m unittest discover -s tests -p 'test_frontend_static.py' -v
      - name: Backend diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 app
      - name: Remove disposable CI stack and credentials
        if: always()
        shell: bash
        run: |
          trap 'rm -f .env .env.local-admin' EXIT
          if [ -f .env ]; then
            docker compose down --volumes --remove-orphans
          fi
