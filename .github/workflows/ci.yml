name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repository:
    name: Documentation and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Verify local documentation links and code fences
        run: make test-docs
      - name: Install checksum-pinned local secret scanner
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan repository history without external upload
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --config .gitleaks.toml \
            --log-opts=--all --redact=100 --ignore-gitleaks-allow --no-banner
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install SQLite headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev pkg-config
      - name: Install OpenSSL build metadata (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 pkg-config
          echo "OPENBOARD_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      - name: Build environment
        run: |
          python3 --version
          node --version
          cc --version
          pkg-config --modversion openssl
      - name: Build
        run: make
      - name: Integration tests
        run: make test
      - name: Frontend data formats
        if: ${{ !cancelled() }}
        run: make test-frontend
      - name: Proxy authentication limits
        if: ${{ !cancelled() }}
        run: make test-security
      - name: Address and undefined behavior sanitizers
        if: ${{ !cancelled() }}
        run: make test-sanitize
  fuzz:
    name: Native fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install native fuzzer prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev libssl-dev pkg-config
      - name: Run bounded HTTP, JSON and Unicode fuzz campaigns
        run: FUZZ_CC=clang make fuzz-smoke
      - name: Preserve synthetic fuzz results and crash inputs
        if: ${{ !cancelled() && hashFiles('build/fuzz/report.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-fuzz-${{ github.sha }}
          path: |
            build/fuzz/report.json
            build/fuzz/*.log
            build/fuzz/artifacts/
          if-no-files-found: error
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: openboard-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Generate private Compose configuration
        run: python3 scripts/init-env.py --http-port 8088 --https-port 8443 --admin-port 8181
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build all five hardened images
        run: docker compose build app frontend postgres mongo npm
      - name: Install native external-storage test drivers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev libpq-dev libmongoc-dev pkg-config
      - name: Build native external-storage test binary
        run: make EXTERNAL_STORAGE=1
      - name: Test all external-storage scenarios in fresh isolated databases
        run: python3 scripts/test-cloud-stack.py
      - name: Verify complete encrypted application and proxy recovery
        env:
          OPENBOARD_RECOVERY_TEST: '1'
        run: python3 -m unittest discover -s tests -p 'test_backup_recovery.py' -v
      - name: Verify database image authentication and backup tools
        env:
          OPENBOARD_POSTGRES_IMAGE: openboard-postgres:0.6.1
          OPENBOARD_MONGO_IMAGE: openboard-mongo:0.6.1
        run: python3 -m unittest discover -s tests -p 'test_database_images.py' -v
      - name: Start all five services
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Bootstrap private administrators and local proxy
        run: python3 scripts/bootstrap-local.py
      - name: Verify private boundaries and proxy readiness
        run: python3 scripts/check-deployment.py
      - name: Verify spoofing resistance and proxy rate limits
        env:
          OPENBOARD_PROXY_IMAGE: openboard-proxy:0.6.1
          OPENBOARD_APP_IMAGE: openboard:0.6.1
          OPENBOARD_FRONTEND_IMAGE: openboard-frontend:0.6.1
        run: python3 -m unittest discover -s tests -p 'test_proxy_security.py' -v
      - name: Verify public frontend and authenticated API routing
        shell: bash
        run: |
          set -euo pipefail
          authority='openboard.localhost:8088'
          url='http://127.0.0.1:8088'
          curl --fail --silent --show-error --max-time 20 --header "Host: $authority" --output /dev/null "$url/"
          curl --fail --silent --show-error --max-time 20 --header "Host: $authority" --output /dev/null "$url/api/ready"
          test "$(curl --silent --show-error --max-time 20 --header "Host: $authority" --output /dev/null --write-out '%{http_code}' "$url/api/boards")" = 401
          curl --fail --silent --show-error --max-time 20 --header "Host: $authority" "$url/api/version" |
            python3 -c 'import json,sys; version=json.load(sys.stdin); assert version["auth_enabled"] is True; assert version["storage"] == "postgresql+mongodb"'
      - name: Verify isolated static frontend container
        env:
          OPENBOARD_FRONTEND_IMAGE: openboard-frontend:0.6.1
        run: python3 -m unittest discover -s tests -p 'test_frontend_static.py' -v
      - name: Backend diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 app
      - name: Remove disposable CI stack and credentials
        if: always()
        shell: bash
        run: |
          trap 'rm -f .env .env.local-admin' EXIT
          if [ -f .env ]; then
            docker compose down --volumes --remove-orphans
          fi
