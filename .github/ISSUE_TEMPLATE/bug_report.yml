name: Bug report
description: Report a reproducible problem using synthetic, redacted data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use the private reporting instructions in SECURITY.md.
        Never attach environment files, database dumps, cookies or connection strings.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the image digest if the problem depends on a specific build.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Docker/Compose versions, and SQLite or PostgreSQL/MongoDB storage.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal reproduction with synthetic data and the relevant account role.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Optional screenshot or short error excerpt; remove all private information.
